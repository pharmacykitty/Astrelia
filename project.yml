name: Astrelia
options:
  bundleIdPrefix: pink.ely
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing: set DEVELOPMENT_TEAM to your own Team ID to build on a device.
    DEVELOPMENT_TEAM: "52K336H235"
    CODE_SIGN_STYLE: Automatic

packages:
  CelestialCore:
    path: ../AstroPackages/CelestialCore

targets:
  Astrelia:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CelestialCore
        product: CelestialCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pink.ely.astrelia
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # Launch screen lives in App/Info.plist (UILaunchScreen dict — night-ink
        # colour + dim rete mark); the generated plist merges on top of it.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Astrelia
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # iPad multitasking requires all four orientations; App Store validation rejects the bundle otherwise.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Astrelia uses your location to compute the real positions of the Sun, Moon, and stars in your sky."
        INFOPLIST_KEY_NSMotionUsageDescription: "Astrelia uses device motion to know where your phone is pointed at the sky."
        INFOPLIST_KEY_NSCameraUsageDescription: "Astrelia uses the camera to overlay the sky on your real surroundings in AR mode."
