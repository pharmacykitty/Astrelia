name: Astrolabe
options:
  bundleIdPrefix: com.astrolabe
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  CelestialCore:
    path: Packages/CelestialCore

targets:
  Astrolabe:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CelestialCore
        product: CelestialCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astrolabe.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Astrolabe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
