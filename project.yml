name: Astrolabe
options:
  bundleIdPrefix: com.astrolabe
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing — team "Elysia Muñoz" (a Team ID is not secret; it ships in every app).
    DEVELOPMENT_TEAM: "52K336H235"
    CODE_SIGN_STYLE: Automatic

packages:
  CelestialCore:
    path: ../AstroPackages/CelestialCore

targets:
  Astrolabe:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CelestialCore
        product: CelestialCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astrolabe.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Astrolabe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Astrolabe uses your location to compute the real positions of the Sun, Moon, and stars in your sky."
        INFOPLIST_KEY_NSMotionUsageDescription: "Astrolabe uses device motion to know where your phone is pointed at the sky."
        INFOPLIST_KEY_NSCameraUsageDescription: "Astrolabe uses the camera to overlay the sky on your real surroundings in AR mode."
